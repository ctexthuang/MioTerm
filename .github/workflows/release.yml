name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            artifact: target/release/MioTerm-*-macos-arm64.dmg
          - platform: windows-x86_64
            os: windows-2022
            artifact: target/release/MioTerm-*-windows-x86_64.zip
          - platform: linux-x86_64
            os: ubuntu-24.04
            artifact: target/release/MioTerm-*-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS with ad-hoc signing, without notarization
        if: runner.os == 'macOS'
        run: scripts/mac-app.sh
      - name: Package Windows without a publisher signature
        if: runner.os == 'Windows'
        run: scripts/windows-zip.ps1
      - name: Package Linux on Debian 12
        if: runner.os == 'Linux'
        run: scripts/linux-tar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MioTerm-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish preview
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require passing CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$ci" ]; then
            echo "release: no CI run found for $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$ci" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          pattern: MioTerm-*
          path: dist
          merge-multiple: true
      - name: Create a prerelease with all three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cd dist
          sha256sum MioTerm-* > SHA256SUMS.txt
          cd ..
          gh release create "v$version" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MioTerm $version Preview" \
            --notes-file docs/release-notes.md
