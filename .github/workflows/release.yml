name: Release
run-name: MioTerm ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match Cargo.toml
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"release: tag {tag!r} must match Cargo.toml version v{version}")
          print(f"release: validated {tag}")
          PY

  macos:
    name: Check and package macOS arm64
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install and verify shell test dependencies
        run: |
          brew install fish
          command -v zsh
          command -v fish
          command -v pwsh
      - run: scripts/check.sh
      - run: cargo build --locked
      - name: Package macOS with ad-hoc signing, without notarization
        run: scripts/mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MioTerm-macos-arm64
          path: target/release/MioTerm-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Check and package Windows x86_64
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked --quiet
      - run: cargo build --locked
      - name: Package Windows without a publisher signature
        run: scripts/windows-zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MioTerm-windows-x86_64
          path: target/release/MioTerm-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Check Linux
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: docker.gitea.com/runner-images:ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: |
          apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev \
            libfreetype-dev libdbus-1-dev zsh fish xvfb
          useradd --create-home ci
          chmod o+x "$HOME"
          chown -R ci "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"
          runuser -u ci -- env HOME=/home/ci CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" PATH="$PATH" cargo test --locked --quiet
      - run: cargo build --locked

  package-linux:
    name: Package Linux x86_64
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Package Linux on Debian 12
        run: scripts/linux-tar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MioTerm-linux-x86_64
          path: target/release/MioTerm-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish preview
    needs: [macos, windows, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: MioTerm-*
          path: dist
          merge-multiple: true
      - name: Create a prerelease with all three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cd dist
          sha256sum MioTerm-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "MioTerm $version Preview" \
            --notes-file docs/release-notes.md
